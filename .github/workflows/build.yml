name: Build validation image

# winnowl 通用验证镜像(§28.1):autofix 交付前在**沙盒**内跑 install→lint→build→test。
# 含 flutter+dart / rust / go / node+pnpm+yarn / python 工具链。**零私有内容 → public ghcr**。
# 改 Dockerfile 或本 workflow 即 build+push;版本 tag = v0.0.<run_number>(唯一)+ latest。
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:
  # Toolchains are "latest stable at build time": rebuild weekly so they stay current.
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lollipopkit/polyglot-ci

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:v0.0.${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:latest
      - run: echo "Pushed ${{ env.IMAGE_NAME }}:v0.0.${{ github.run_number }}"
